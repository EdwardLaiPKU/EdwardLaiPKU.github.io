- title_zh: "多智能体医疗循证问答与风险分诊系统"
  title_en: "Multi-Agent Medical Evidence & Triage System"
  published: true
  date: "2026"
  description_zh:
    - "面向健康咨询、风险分诊与循证研究场景，构建任务导向型医疗 AI Agent 系统，将复杂医疗问题拆解为检索、分析、风险判断与证据整合等不同任务。"
    - "系统以 Multi-Agent 协作为核心，结合 Hybrid RAG、Evidence Search、双层 Memory 与 Safety Harness，重点解决多 Agent 之间的职责划分、工具调用、证据引用与医疗安全约束。"
    - "项目更关注真实运行时能力：不仅要求组件“存在”，还要求检索、Memory 与 Safety 真正进入可验证的执行链路。"
  description_en: "A task-oriented medical AI agent system for health consultation, risk triage and evidence-based research, combining multi-agent orchestration, hybrid retrieval, dual-layer memory and safety constraints."
  role_zh: "个人项目"
  role_en: "Personal Project"
  tech_stack:
    - Multi-Agent
    - ReAct
    - RAG
    - Milvus
    - BM25
    - Redis
    - Mem0
    - Medical AI
  tech_stack_zh:
    - Multi-Agent
    - ReAct
    - RAG
    - Milvus
    - BM25
    - Redis
    - Mem0
    - Medical AI
  github: "https://github.com/EdwardLaiPKU/medical-agent-v2"
  article: "/writing/medical-agent-architecture-evolution/"
  status_zh: "已完成"
  status_en: "Completed"
  contributions_zh:
    - "构建面向健康咨询、风险分诊与医学研究工作流的任务路由。"
    - "引入 Agent 级能力策略，控制各 Agent 可访问的医疗与 Memory 工具。"
    - "实现结合 Dense Search、BM25 与 Reciprocal Rank Fusion 的 Hybrid RAG。"
    - "集成 Redis 短期 Memory 与基于 Mem0 的长期 Memory。"
    - "加入路由前风险筛查与最终回复安全校验。"
  contributions_en:
    - "Built task-oriented routing for consultation, risk-triage and medical-research workflows."
    - "Introduced agent-level capability policies to control accessible medical and memory tools."
    - "Implemented hybrid medical retrieval using dense search, BM25 and reciprocal-rank fusion."
    - "Integrated Redis short-term memory with Mem0-based long-term memory."
    - "Added pre-routing risk screening and final-response safety validation."

- title_zh: "医疗 Deep Search Agent 与 Agentic 后训练"
  title_en: "Medical Deep Search Agent with Agentic Post-training"
  published: true
  date: "2026"
  description_zh:
    - "从医疗循证 Agent 中进一步拆出 Deep Search 后训练任务，重点研究模型在长程工具调用、证据检索、失败恢复与多步决策中的 Agent policy。"
    - "项目围绕 Agentic SFT、Recovery SFT 与 Agentic RL 构建完整后训练链路，并通过 trajectory、tool call、reward 与 controlled-failure evaluation 分析模型在真实 rollout 中的行为变化。"
    - "整个实验体系强调 local-first 与可复现性，在单卡环境下完成训练、消融、checkpoint lineage 与 formal evaluation。"
  description_en: "A medical Deep Search agent post-training project focused on long-horizon tool use, evidence acquisition, recovery behavior and agent policy optimization through Agentic SFT, Recovery SFT and Agentic RL."
  role_zh: "个人项目"
  role_en: "Personal Project"
  tech_stack:
