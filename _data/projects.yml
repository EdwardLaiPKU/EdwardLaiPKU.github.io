  article: "/writing/medical-deep-search-agentic-sft/"
  status_zh: "已完成"
  status_en: "Completed"
  contributions_zh:
    - "设计多步医疗证据获取的 runtime contract。"
    - "定义结构化工具观察、证据元数据与 fatal-error 边界。"
    - "构建 Agentic SFT、Recovery SFT 与 Agentic RL 的数据契约和训练流程。"
    - "设计涵盖工具轨迹 SFT、分组 rollout 与 Fatal-Aware GRPO 的训练路径。"
    - "采用 local-first 架构开发，并保留可扩展训练组件。"
  contributions_en:
    - "Designed the runtime contract for multi-step medical evidence acquisition."
    - "Defined structured tool observations, evidence metadata and fatal-error boundaries."
    - "Built data contracts and training pipelines for Agentic SFT, Recovery SFT and Agentic RL experiments."
    - "Designed a training path covering tool-trajectory SFT, grouped rollouts and Fatal-Aware GRPO."
    - "Developed the project under a local-first architecture with scalable training components."

- title_zh: "基于 Protein Language Model 的抗菌肽计算发现系统"
  title_en: "Protein Language Models for Antimicrobial Peptide Discovery"
  published: true
  date: "2025"
  description_zh:
    - "面向抗菌肽计算发现，设计 Generate → Filter → Rank 三阶段建模框架，分别完成条件肽序列生成、AMP/非 AMP 判别与 MIC 活性排序。"
    - "Generator 使用 GPT-2-style Protein LM 与 Soft Prompt / Function Embedding，Sorter 结合 LoRA、SupCon 与 ArcFace 做参数高效判别，MIC 模块进一步探索 ESM-2 residue relation 与 GATv2 图表示。"
    - "项目通过严格的配对实验和 artifact audit 检查每个新增组件的真实贡献，而不是仅依赖更低的 loss 或更复杂的模型结构判断效果。"
  description_en: "A computational antimicrobial peptide discovery project organized around a Generate → Filter → Rank framework, covering conditional peptide generation, AMP/non-AMP classification and MIC activity ranking with protein language models and graph-based representations."
  role_zh: "研究项目"
  role_en: "Research Project"
  tech_stack:
    - Protein Language Model
    - Soft Prompt
    - LoRA
    - SupCon
    - ArcFace
    - GATv2
    - ESM-2
    - AI for Science
  tech_stack_zh:
    - Protein Language Model
    - Soft Prompt
    - LoRA
    - SupCon
    - ArcFace
    - ESM-2
    - GATv2
    - AI for Science
  github: ""
  article: "/writing/amp-discovery-protein-language-model/"
  status_zh: "已完成"
  status_en: "Completed"
  contributions_zh:
    - "基于 GPT-2-style Protein LM、Soft Prompt 与显式 Function Embedding 构建条件肽序列生成模块。"
    - "探索 LoRA、SupCon 与 margin-based classification 在抗菌肽判别中的应用。"
    - "结合序列表征、残基图与蛋白质 embedding 进行 MIC 预测。"
    - "围绕 Generate → Filter → Rank 组织生成、判别与活性排序三个独立计算模块。"
  contributions_en:
    - "Built a conditional peptide generation module using a GPT-2-style protein language model, soft prompts and explicit function embeddings."
    - "Explored LoRA, supervised contrastive learning and margin-based classification for AMP discrimination."
    - "Combined sequence representations, residue graphs and protein embeddings for MIC prediction."
    - "Organized generation, classification and activity ranking as separate stages in a Generate → Filter → Rank computational framework."
