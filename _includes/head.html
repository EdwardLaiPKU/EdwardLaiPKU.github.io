<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
{% assign current_lang = page.lang | default: 'zh' %}
{% if page.alternate_url and page.alternate_url != '' %}
  {% if current_lang == 'en' %}
    <link rel="alternate" hreflang="zh-CN" href="{{ page.alternate_url | absolute_url }}">
    <link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}">
    <link rel="alternate" hreflang="x-default" href="{{ page.alternate_url | absolute_url }}">
  {% else %}
    <link rel="alternate" hreflang="zh-CN" href="{{ page.url | absolute_url }}">
    <link rel="alternate" hreflang="en" href="{{ page.alternate_url | absolute_url }}">
    <link rel="alternate" hreflang="x-default" href="{{ page.url | absolute_url }}">
  {% endif %}
{% endif %}
{% seo %}
{% if page.math %}
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
