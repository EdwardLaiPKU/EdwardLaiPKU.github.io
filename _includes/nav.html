<nav class="site-nav" aria-label="Primary navigation">
  <a class="site-mark" href="{{ '/' | relative_url }}" aria-label="Home">{{ site.name | default: site.title }}</a>
  <div class="nav-links">
    {% for item in site.data.navigation %}
      {% assign item_url = item.url | relative_url %}
      <a href="{{ item_url }}"{% if page.url == item.url or page.url contains item.url and item.url != '/' %} aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </div>
</nav>
